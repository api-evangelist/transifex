- aid: transifex:transifex-resource-string-comments-api
  name: Transifex Resource String Comments API
  description: >-
    Represents comments on resource strings. These are the same comments exposed in the Transifex Editor
    under the "Comments" tab.


    A comment can also be flagged as an **issue**. In this case, some extra functionality is available
      * You can change an issue's status
      * You can change it's category
      * You can assign a priority

    Categories can be configured per organization. To configure the available categories for your organization,
    contact

    <a href="https://www.transifex.com/contact/">Transifex Support</a>.


    For further details & examples, take a look below.
  humanURL: https://developers.transifex.com/reference/
