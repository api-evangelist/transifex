- aid: transifex:transifex-project-webhooks-api
  name: Transifex Project Webhooks API
  description: >-
    Project Webhooks lets you specify actions which will trigger some notification event. When that event
    occurs, Transfex application will make a HTTP request to the URL configured for the webhook (callback_url).
    The request is done as a HTTP POST request.

    For example a callback url will be triggered whenever a target language of a resource has fully been
    translated, enabling the client to implement a custom workflow to pull translations as soon as they
    are ready, without having to constantly check Transifex for updates.
  humanURL: https://developers.transifex.com/reference/
  baseURL: https://rest.api.transifex.com
