                                  required:
                                  - related
                                  type: object
                              required:
                              - links
                              - data
                              type: object
                            resources:
                              additionalProperties: false
                              properties:
                                links:
                                  additionalProperties: false
                                  description: Project resources links.
                                  properties:
                                    related:
                                      description: Project resources details link.
                                      example: /resources?filter[project]:XXX
                                      type: string
                                  required:
                                  - related
                                  type: object
                              required:
