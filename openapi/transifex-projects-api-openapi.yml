                                  - id
                                  type: object
                                links:
                                  additionalProperties: false
                                  properties:
                                    related:
                                      example: /teams/o:organization_slug:t:team_slug
                                      type: string
                                    self:
                                      example: /projects/o:organization_slug:t:team_slug/relationships/team
                                      type: string
                                  required:
                                  - self
                                  - related
                                  type: object
                              required:
                              - links
                              - data
                              type: object
                          required:
                          - source_language
                          - organization
                          - team
                          - languages
                          - maintainers
                          - resources
                          type: object
                        type:
                          enum:
                          - projects
                          type: string
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      - links
                      type: object
                    type: array
                  links:
                    additionalProperties: false
                    description: Pagination links.
                    properties:
                      next:
                        description: Project cursor link.
                        example: /projects?filter[organization]=o:organization_slug&page[cursor]=XXX
                        nullable: true
                        type: string
                      previous:
                        description: Project cursor link.
                        example: /projects?filter[organization]=o:organization_slug&page[cursor]=XXX
                        nullable: true
                        type: string
                      self:
                        description: Project details link.
                        example: /projects/o:organization_slug:p:project_slug
                        type: string
                    required:
                    - self
                    - next
                    - previous
                    type: object
                required:
