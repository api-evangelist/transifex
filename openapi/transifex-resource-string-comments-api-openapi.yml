                                        description: User identifier.
                                        example: u:user_1
                                        pattern: ^u:[\w.-]+$
                                        type: string
                                      type:
                                        enum:
                                        - users
                                        type: string
                                    required:
                                    - type
                                    - id
                                    type: object
                                  links:
                                    additionalProperties: false
                                    description: User links.
                                    properties:
                                      related:
                                        description: User details link.
                                        example: /users/u:user_1
                                        type: string
                                    required:
                                    - related
                                    type: object
                                type:
                                - object
                                - 'null'
                              resource:
                                additionalProperties: false
                                properties:
