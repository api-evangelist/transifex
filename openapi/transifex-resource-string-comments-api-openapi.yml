                                    required:
                                    - type
                                    - id
                                    type: object
                                  links:
                                    additionalProperties: false
                                    description: Language related link.
                                    properties:
                                      related:
                                        description: Language details link.
                                        example: /languages/l:en_US
                                        type: string
                                    required:
                                    - related
                                    type: object
                                type: object
                              resolver:
                                additionalProperties: false
                                properties:
