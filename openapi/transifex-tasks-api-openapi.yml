                          type: string
                        status:
                          example: '403'
                          type: string
                        title:
                          example: Operation not allowed
                          type: string
                      type: object
                    type: array
                type: object
          description: Forbidden
        '404':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      properties:
                        code:
                          example: not found
                          type: string
                        detail:
                          example: Object not found. It may have been deleted or not been created yet
                          type: string
                        status:
                          example: '404'
                          type: string
                        title:
                          example: Object not found
                          type: string
                      type: object
                    type: array
                type: object
          description: Not found
        '409':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        code:
                          example: conflict
                          type: string
                        detail:
                          example: Value `some_field_value` already exists
                          type: string
                        source:
                          additionalProperties: false
                          properties:
                            pointer:
                              example: /data/attributes/some_field
                              type: string
                          type: object
                        status:
                          example: '409'
                          type: string
                        title:
                          example: Field `some_field` conflicted
                          type: string
                      type: object
                    type: array
                type: object
          description: Conflict
        '500':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        code:
                          example: server error
                          type: string
                        detail:
                          example: Something went wrong, please try again
                          type: string
                        status:
                          example: '500'
                          type: string
                        title:
                          example: Something went wrong
                          type: string
                      type: object
                    type: array
                type: object
          description: Internal Error
      summary: List tasks
      tags:
      - Tasks
      x-released: true
      operationId: getTasks
      x-operation-id-source: derived
    post:
      description: 'Making a POST request to this endpoint creates a task for the given project,

        with the provided language and source string attributes. If it is not set to auto assign the assignees,

        use the following endpoint [tasks//languages//relationships/assignees]'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              additionalProperties: false
              properties:
                data:
                  additionalProperties: false
                  description: Create task body request details.
                  properties:
                    attributes:
                      additionalProperties: false
                      description: Task attributes.
                      properties:
                        assignee_selection_method:
                          enum:
                          - SKIP
                          - AUTO
                          example: SKIP
                          type: string
                        description:
                          description: A description of the Task.
                          example: Translate all resource strings
                          type: string
                        due_dates:
                          additionalProperties: false
                          description: The due dates to create the task for.
                          properties:
                            PROOFREAD:
                              description: The due date to create the task for proofread.
                              example: '2025-01-01'
                              type: string
                            REVIEW:
                              description: The due date to create the task for review.
                              example: '2025-01-01'
                              type: string
                            TRANSLATION:
                              description: The due date to create the task for translation.
                              example: '2025-01-01'
                              type: string
                          type:
                          - object
                          - 'null'
                        exclusive_editing:
                          description: Whether to enable exclusive editing for the task.
                          example: true
                          type: boolean
                        language_codes:
                          description: The languages to create the task for.
                          example:
                          - l:en
                          - l:fr
                          items:
                            type: string
                          type: array
                        name:
                          description: The name of the Task.
                          example: Transifex task
                          maxLength: 255
                          type: string
                        priority:
                          enum:
                          - NORMAL
                          - HIGH
                          - URGENT
                          example: NORMAL
                          type: string
                        resource_string_ids:
                          description: The resource strings to create the task for.
                          example:
                          - o:<org_slug>:p:<proj_slug>:r:<res_slug>:s:<string_hash1>
                          - o:<org_slug>:p:<proj_slug>:r:<res_slug>:s:<string_hash2>
                          items:
                            type: string
                          type: array
                        task_type:
                          enum:
                          - TRANSLATION
                          - AI_TRANSLATION
                          - TRANSLATION_AND_REVIEW
                          - AI_TRANSLATION_AND_REVIEW
                          - TRANSLATION_AND_REVIEW_AND_PROOFREAD
                          - AI_TRANSLATION_AND_REVIEW_AND_PROOFREAD
                          example: TRANSLATION
                          type: string
                      required:
                      - name
                      - task_type
                      - language_codes
                      - resource_string_ids
                      type: object
                    relationships:
                      additionalProperties: false
                      description: Task relationships.
                      properties:
                        project:
                          additionalProperties: false
                          description: The `project` task should belong to.
                          properties:
                            data:
                              additionalProperties: false
                              description: Project data container.
                              properties:
                                id:
                                  description: Project identifier.
                                  example: o:organization_slug:p:project_slug
                                  pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+$
                                  type: string
                                type:
                                  enum:
                                  - projects
                                  type: string
                              required:
                              - type
                              - id
                              type: object
                          required:
                          - data
                          type: object
                      required:
                      - project
                      type: object
                    type:
                      enum:
                      - tasks
                      type: string
                  required:
                  - type
                  - attributes
                  - relationships
                  type: object
              required:
              - data
              type: object
        required: true
      responses:
        '201':
          content:
