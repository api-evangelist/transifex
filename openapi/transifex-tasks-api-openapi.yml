openapi: 3.2.0
info:
  contact:
    email: support@transifex.com
    name: Transifex Support
  description: '# Introduction


    This API is based on **{json:api}**.'
  title: Transifex Tasks API
  version: '3.0'
  x-logo:
    altText: Transifex logo
    backgroundColor: '#FFFFFF'
    url: transifex-blue-logo.svg
servers:
- url: https://rest.api.transifex.com
security:
- bearerAuth: []
tags:
- description: Tasks are work items that can be assigned to users within a project. They help organize and track translation work.
  name: Tasks
paths:
  /tasks:
    get:
      description: Get the list of tasks that belong to a single organization.
      parameters:
      - description: Filter results by an organization
        in: query
        name: filter[organization]
        required: true
        schema:
          description: Organization identifier.
          example: o:org_123
          pattern: ^o:[a-zA-Z0-9._-]+$
          type: string
      - description: 'The cursor used for pagination. The value of the cursor must be retrieved from pagination links included in previous responses; you should not attempt to write them on your own.

          '
        in: query
        name: page[cursor]
        schema:
          type: string
      - description: Filter tasks by a project
        in: query
        name: filter[project]
        required: false
        schema:
          description: Project identifier.
          example: o:organization_slug:p:project_slug
          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+$
          type: string
      - description: Filter tasks by a task name
        in: query
        name: filter[name]
        required: false
        schema:
          type: string
      - description: Filter tasks by a task status
        in: query
        name: filter[statuses]
        required: false
        schema:
          description: Comma-separated list of task statuses
          example: PENDING,FINISHED
          pattern: ^(INITIALIZING|PENDING|FINISHED|DELETED)(,(INITIALIZING|PENDING|FINISHED|DELETED))*$
          type: string
      - description: Filter tasks by a task assignee(s0)
        in: query
        name: filter[assignees]
        required: false
        schema:
          description: Comma-separated list of user IDs and optionally "unassigned"
          example: u:user_1,u:user_2,unassigned
          pattern: ^(u:[\w.-]+|unassigned)(,(u:[\w.-]+|unassigned))*$
          type: string
      - description: Filter tasks by a task creator(s)
        in: query
        name: filter[creators]
        required: false
        schema:
          description: Comma-separated list of user IDs
          example: u:user_1,u:user_2
          pattern: ^u:[\w.-]+(,u:[\w.-]+)*$
          type: string
      - description: Filter tasks by a task due date before
        in: query
        name: filter[due_date][before]
        required: false
        schema:
          example: XXXX-XX-XX
          format: date
          type: string
      - description: Filter tasks by a task due date after
        in: query
        name: filter[due_date][after]
        required: false
        schema:
          example: XXXX-XX-XX
          format: date
          type: string
      - description: Filter tasks by a task created date before
        in: query
        name: filter[created_date][before]
        required: false
        schema:
          example: XXXX-XX-XX
          format: date
          type: string
      - description: Filter tasks by a task created date after
        in: query
        name: filter[created_date][after]
        required: false
        schema:
          example: XXXX-XX-XX
          format: date
          type: string
      - description: Filter tasks by a language code
        in: query
        name: filter[language_code]
        required: false
        schema:
          example: en
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: List of Task objects.
                    items:
                      additionalProperties: false
                      properties:
                        attributes:
                          additionalProperties: false
                          description: Task attributes.
                          properties:
                            completed_at:
                              description: The date when the task was completed.
                              example: '2025-01-01T00:00:00Z'
                              format: date-time
                              type:
                              - string
                              - 'null'
                            created_at:
                              description: The date when the task was created.
                              example: '2025-01-01T00:00:00Z'
                              format: date-time
                              type: string
                            description:
                              description: A description of the Task.
                              example: Translate all resource strings
                              type: string
                            due_date:
                              description: The final due date of the task.
                              example: '2025-01-01'
                              format: date
                              type:
                              - string
                              - 'null'
                            exclusive_editing:
                              description: Whether the task has exclusive editing enabled.
                              example: false
                              type: boolean
                            name:
                              description: The name of the Task.
                              example: Transifex task
                              maxLength: 255
                              type: string
                            priority:
                              enum:
                              - NORMAL
                              - HIGH
                              - URGENT
                              example: NORMAL
                              type: string
                            status:
                              enum:
                              - INITIALIZING
                              - PENDING
                              - FINISHED
                              - DELETED
                              example: PENDING
                              type: string
                            type:
                              example:
                              - TRANSLATION
                              - REVIEW
                              items:
                                type: string
                              type: array
                            updated_at:
                              description: The date when the task was updated.
                              example: '2025-01-01T00:00:00Z'
                              format: date-time
                              type: string
                          required:
                          - name
                          type: object
                        id:
                          description: Task identifier.
                          example: o:organization_slug:p:project_slug:t:task_hash
                          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:t:[a-zA-Z0-9_-]+$
                          type: string
                        links:
                          additionalProperties: false
                          description: Tasks self link.
                          properties:
                            self:
                              description: Tasks details link.
                              example: /tasks/o:organization_slug:p:project_slug:t:task_id
                              type: string
                          required:
                          - self
                          type: object
                        relationships:
                          additionalProperties: false
                          description: Task relationships.
                          properties:
                            languages:
                              additionalProperties: false
                              properties:
                                links:
                                  additionalProperties: false
                                  description: Task progress per language link.
                                  properties:
                                    related:
                                      description: Task progress per language link.
                                      example: /tasks/o:organization_slug:p:project_slug:t:task_id/languages
                                      type: string
                                  required:
                                  - related
                                  type: object
                              required:
                              - links
                              type: object
                            owner:
                              additionalProperties: false
                              properties:
                                data:
                                  description: User id.
                                  properties:
                                    id:
                                      description: User identifier.
                                      example: u:user_1
                                      pattern: ^u:[\w.-]+$
                                      type: string
                                    type:
                                      enum:
                                      - users
                                      type: string
                                  required:
                                  - type
                                  - id
                                  type: object
                                links:
                                  additionalProperties: false
                                  description: User links.
                                  properties:
                                    related:
                                      description: User details link.
                                      example: /users/u:user_1
                                      type: string
                                  required:
                                  - related
                                  type: object
                              required:
                              - links
                              - data
                              type: object
                            project:
                              additionalProperties: false
                              properties:
                                data:
                                  additionalProperties: false
                                  description: Project data container.
                                  properties:
                                    id:
                                      description: Project identifier.
                                      example: o:organization_slug:p:project_slug
                                      pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+$
                                      type: string
                                    type:
                                      enum:
                                      - projects
                                      type: string
                                  required:
                                  - type
                                  - id
                                  type: object
                                links:
                                  additionalProperties: false
                                  description: Project links.
                                  properties:
                                    related:
                                      description: Project details link.
                                      example: /projects/o:organization_slug:p:project_slug
                                      type: string
                                  required:
                                  - related
                                  type: object
                              required:
                              - links
                              - data
                              type: object
                          required:
                          - owner
                          - project
                          type: object
                        type:
                          enum:
                          - tasks
                          type: string
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      - links
                      type: object
                    type: array
                  links:
                    additionalProperties: false
                    description: Pagination links.
                    properties:
                      next:
                        description: Tasks cursor link.
                        example: /tasks?filter[organization]=o:organization_slug&page[cursor]=XXX
                        type:
                        - string
                        - 'null'
                      previous:
                        description: Tasks cursor link.
                        example: /tasks?filter[organization]=o:organization_slug&page[cursor]=XXX
                        type:
                        - string
                        - 'null'
                      self:
                        description: Tasks details link.
                        example: /tasks/o:organization_slug:p:project_slug:t:task_id
                        type: string
                    required:
                    - self
                    - next
                    - previous
                    type: object
                required:
                - data
                - links
                type: object
          description: Get a list of all the tasks for a given organization
        '400':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        code:
                          example: invalid
                          type: string
                        detail:
                          example: Enter a valid `name` consisting of Unicode letters, numbers, underscores, or hyphens
                          type: string
                        source:
                          anyOf:
                          - properties:
                              pointer:
                                example: /data/attributes/name
                                type: string
                          - properties:
                              parameter:
                                example: ?filter[foo]
                                type: string
                        status:
                          example: '400'
                          type: string
                        title:
                          example: Field `name` is invalid
                          type: string
                      type: object
                    type: array
                type: object
          description: Invalid
        '401':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        code:
                          example: unauthorized
                          type: string
                        detail:
                          example: Please verify your credentials
                          type: string
                        status:
                          example: '401'
                          type: string
                        title:
                          example: Unauthorized
                          type: string
                      type: object
                    type: array
                type: object
          description: Unauthorized
        '403':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: true
                      properties:
                        code:
                          example: forbidden
                          type: string
                        detail:
