                    type: array
                type: object
          description: Internal Error
      security:
      - bearerAuth: []
      summary: Get resource merge status
      tags:
      - Resources
      operationId: getResourceAsyncMerges{resourceAsyncMergeId}
      x-operation-id-source: derived
  /resources:
    get:
      description: Get a list of all resources (in a specific project).
      parameters:
      - description: Filter results by a project
        in: query
        name: filter[project]
        required: true
        schema:
          description: Project identifier.
          example: o:organization_slug:p:project_slug
          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+$
          type: string
      - description: 'The cursor used for pagination. The value of the cursor must be retrieved from pagination links included in previous responses; you should not attempt to write them on your own.

          '
        in: query
        name: page[cursor]
        schema:
          type: string
      - in: query
        name: filter[slug]
        required: false
        schema:
          pattern: ^[a-zA-Z0-9._-]+$
          type: string
      - in: query
        name: filter[name]
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    description: List of resource objects.
                    items:
                      additionalProperties: false
                      properties:
                        attributes:
                          additionalProperties: false
                          properties:
                            accept_translations:
                              description: Whether resource should accept translations or not
                              example: true
                              type: boolean
                            categories:
                              description: List of categories to associate similar resources
                              example:
                              - category_1
                              - category_2
                              items:
                                type: string
                              type: array
                            datetime_created:
                              example: XXXX-XX-XXTXX:XX:XXZ
                              format: date-time
                              type: string
                            datetime_modified:
                              example: XXXX-XX-XXTXX:XX:XXZ
                              format: date-time
                              type: string
                            i18n_options:
                              description: Any options that determine how the resource will be parsed and compiled
                              example:
                                allow_duplicate_strings: true
                              properties:
                                allow_duplicate_strings:
                                  description: If true, identical strings found in the resource will be parsed as separate strings; otherwise, identical strings will be considered as instances of the same string. Available in "HTML" i18n type resources.
                                  type: boolean
                              type:
                              - object
                              - 'null'
                            i18n_version:
                              description: File format type version.
                              example: 1
                              type: number
                            mp4_url:
                              description: A (public) url to provide an MP4 video file for subtitles translation
                              example: https://some.host.net/some_mp4_url
                              type:
                              - string
                              - 'null'
                            name:
                              description: Name of the resource
                              example: Resource Name
                              type: string
                            ogg_url:
                              description: A (public) url to provide an OGG video file for subtitles translation
                              example: https://some.host.net/some_ogg_url
                              type:
                              - string
                              - 'null'
                            priority:
                              enum:
                              - normal
                              - high
                              - urgent
                              example: normal
                              type: string
                            slug:
                              description: Slug of the resource
                              example: Slug Name
                              type: string
                            string_count:
                              description: Number of strings in the resource content.
                              example: 0
                              type: number
                            webm_url:
                              description: A (public) url to provide a WEMB video file for subtitles translation
                              example: https://some.host.net/some_webm_url
                              type:
                              - string
                              - 'null'
                            word_count:
                              description: Number of words in the resource content.
                              example: 0
                              type: number
                            youtube_url:
                              description: A (public) YouTube url to provide a video file for subtitles translation
                              example: https://www.youtube.com/
                              type:
                              - string
                              - 'null'
                          required:
                          - slug
                          - name
                          - i18n_version
                          - priority
                          - accept_translations
                          - categories
                          - i18n_options
                          - mp4_url
                          - ogg_url
                          - webm_url
                          - youtube_url
                          - string_count
                          - word_count
                          - datetime_created
                          - datetime_modified
                          type: object
                        id:
                          description: Resource identifier.
                          example: o:organization_slug:p:project_slug:r:resource_slug
                          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:r:[a-zA-Z0-9_-]+$
                          type: string
                        links:
                          additionalProperties: false
                          description: Resource links.
                          properties:
                            self:
                              description: Resource details link.
                              example: /resources/o:organization_slug:p:project_slug:r:resource_slug
                              type: string
                          required:
                          - self
                          type: object
                        relationships:
                          additionalProperties: false
                          description: Resource relationships.
                          properties:
                            i18n_format:
                              additionalProperties: false
                              description: I18n format object.
                              properties:
                                data:
                                  additionalProperties: false
                                  description: I18n Format identifier object.
                                  properties:
                                    id:
                                      example: YML_KEY
                                      pattern: ^[A-Z0-9@_-]+$
                                      type: string
                                    type:
                                      enum:
                                      - i18n_formats
                                      type: string
                                  required:
                                  - type
                                  - id
                                  type: object
                              required:
                              - data
                              type: object
                            project:
                              additionalProperties: false
                              description: Project object.
                              properties:
                                data:
                                  additionalProperties: false
                                  description: Project data container.
                                  properties:
                                    id:
                                      description: Project identifier.
                                      example: o:organization_slug:p:project_slug
                                      pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+$
                                      type: string
                                    type:
                                      enum:
                                      - projects
                                      type: string
                                  required:
                                  - type
                                  - id
                                  type: object
                                links:
                                  additionalProperties: false
                                  description: Project links.
                                  properties:
                                    related:
                                      description: Project details link.
                                      example: /projects/o:organization_slug:p:project_slug
                                      type: string
                                  required:
                                  - related
                                  type: object
                              required:
                              - links
                              - data
                              type: object
                          required:
                          - project
                          type: object
                        type:
                          enum:
                          - resources
                          type: string
                      required:
                      - type
                      - id
                      - attributes
                      - relationships
                      - links
                      type: object
                    type: array
                  links:
                    additionalProperties: false
                    description: Pagination links.
                    properties:
                      next:
                        description: Resource results cursor link.
                        example: /resources?filter[project]=o:organization_slug:p:project_slug&page[cursor]=XXX
                        type:
                        - string
                        - 'null'
                      previous:
                        description: Resource results cursor link.
                        example: /resources?filter[project]=o:organization_slug:p:project_slug&page[cursor]=XXX
                        type:
                        - string
                        - 'null'
                      self:
                        description: Resource results cursor link.
                        example: /resources?filter[project]=o:organization_slug:p:project_slug
                        type: string
                    required:
                    - self
                    - next
                    - previous
                    type: object
                required:
                - links
                - data
                type: object
          description: List of resources for a given project.
        '400':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  errors:
                    items:
                      additionalProperties: false
                      properties:
                        code:
                          example: invalid
                          type: string
                        detail:
                          example: Enter a valid `name` consisting of Unicode letters, numbers, underscores, or hyphens
                          type: string
                        source:
