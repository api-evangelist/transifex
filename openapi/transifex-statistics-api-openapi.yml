                                  format: date-time
                                  type: string
                                proofread_strings:
                                  example: 10
                                  type: number
                                proofread_words:
                                  example: 10
                                  type: number
                                reviewed_strings:
                                  example: 10
                                  type: number
                                reviewed_words:
                                  example: 10
                                  type: number
                                total_strings:
                                  example: 10
                                  type: number
                                total_words:
                                  example: 10
                                  type: number
                                translated_strings:
                                  example: 10
                                  type: number
                                translated_words:
                                  example: 10
                                  type: number
                                untranslated_strings:
                                  example: 10
                                  type: number
                                untranslated_words:
                                  example: 10
                                  type: number
                              required:
                              - untranslated_words
                              - translated_words
                              - reviewed_words
                              - proofread_words
                              - total_words
                              - untranslated_strings
                              - translated_strings
                              - reviewed_strings
                              - proofread_strings
                              - total_strings
                              - last_update
                              - last_translation_update
