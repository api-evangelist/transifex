                                  format: date-time
                                  nullable: true
                                  type: string
                                last_review_update:
                                  example: XXXX-XX-XXTXX:XX:XXZ
                                  format: date-time
                                  nullable: true
                                  type: string
                                last_translation_update:
                                  example: XXXX-XX-XXTXX:XX:XXZ
                                  format: date-time
                                  nullable: true
