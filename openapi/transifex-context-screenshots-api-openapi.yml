paths:
  /context_screenshot_maps:
    get:
      description: Get the context screenshots maps for a project. You can further narrow down the list using the available filters.
      parameters:
      - description: Filter results by a project
        in: query
        name: filter[project]
        required: true
        schema:
          description: Project identifier.
          example: o:organization_slug:p:project_slug
          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+$
          type: string
      - description: Filter results by a resource
        in: query
        name: filter[resource]
        required: false
        schema:
          description: Resource identifier.
          example: o:organization_slug:p:project_slug:r:resource_slug
          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:r:[a-zA-Z0-9_-]+$
          type: string
      - in: query
        name: filter[resource_string]
        required: false
        schema:
          description: Resource String identifier.
          example: o:organization_slug:p:project_slug:r:resource_slug:s:2e354ef120752c67afa1b6855aa80c52
          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:r:[a-zA-Z0-9_-]+:s:[0-9a-f]{32}
          type: string
      - description: Retrieve maps related to a specific context screenshot
        in: query
        name: filter[context_screenshot]
        required: false
        schema:
          description: Context screenshot identifier
          example: o:organization_slug:p:project_slug:s:4abfc726-6a27-4c33-9d99-e5254c8df748
          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:s:([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
          type: string
      - description: 'The cursor used for pagination. The value of the cursor must be retrieved from pagination links included in previous responses; you should not attempt to write them on your own.

          '
        in: query
        name: page[cursor]
        schema:
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      properties:
                        attributes:
                          additionalProperties: false
                          properties:
                            coordinate_x:
                              description: coordinate of the string position in the screenshot determined by measuring parallel to an x-axis, measured in pixels.
                              example: 423
                              nullable: true
                              type: number
                            coordinate_y:
                              description: coordinate of the string position in the screenshot determined by measuring parallel to an y-axis, measured in pixels.
                              example: 261
                              nullable: true
                              type: number
                            datetime_created:
                              example: XXXX-XX-XXTXX:XX:XXZ
                              format: date-time
                              type: string
                            datetime_modified:
                              example: XXXX-XX-XXTXX:XX:XXZ
                              format: date-time
                              type: string
                            height:
                              description: height of the string in screenshot, measured in pixels.
                              example: 59
                              nullable: true
                              type: number
                            width:
                              description: width of the string in screenshot, measured in pixels.
                              example: 372
                              nullable: true
                              type: number
                          required:
                          - datetime_created
                          - datetime_modified
                          type: object
                        id:
                          description: Context screenshot map identifier.
                          example: o:organization_slug:p:project_slug:s:4abfc726-6a27-4c33-9d99-e5254c8df748:r:resource_slug:m:4abfc726-6a27-4c33-9d99-e5254c8df748
                          pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:s:([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}):r:[a-zA-Z0-9._-]+:m:([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
                          type: string
                        links:
                          additionalProperties: false
                          properties:
                            self:
                              example: /context_screenshots_maps/o:organization_slug:p:project_slug:s:4abfc726-6a27-4c33-9d99-e5254c8df748:r:resource_slug:m:4abfc726-6a27-4c33-9d99-e5254c8df748
                              type: string
                          required:
                          - self
                          type: object
                        relationships:
                          additionalProperties: false
                          properties:
                            context_screenshot:
                              additionalProperties: false
                              properties:
                                data:
                                  additionalProperties: false
                                  description: Context Screenshot identifier data container
                                  properties:
                                    id:
                                      description: Context screenshot identifier
                                      example: o:organization_slug:p:project_slug:s:4abfc726-6a27-4c33-9d99-e5254c8df748
                                      pattern: ^o:[a-zA-Z0-9._-]+:p:[a-zA-Z0-9_-]+:s:([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
                                      type: string
                                    type:
                                      enum:
                                      - context_screenshots
                                      type: string
                                  required:
                                  - type
                                  - id
                                  type: object
                                links:
                                  additionalProperties: false
                                  description: Context screenshot related link.
                                  properties:
                                    related:
                                      description: Context screenshot details link.
                                      example: /context_screenshots/o:organization_slug:p:project_slug:s:4abfc726-6a27-4c33-9d99-e5254c8df748
                                      type: string
                                  required:
                                  - related
                                  type: object
                              required:
                              - links
                              - data
                              type: object
                            resource_string:
                              additionalProperties: false
                              properties:
